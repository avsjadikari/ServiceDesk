# Complete embedded nginx configuration for the all-in-one Alpine image.
# Master + workers run as the unprivileged `servicedesk` user, so the listen
# port must be unprivileged (8080; bind lower ports with NET_BIND_SERVICE) and
# all writable paths live under /tmp.
user servicedesk;
worker_processes auto;

pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml application/xml+rss
               text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Echo the externally-terminated scheme (https behind a TLS proxy) when
    # present, otherwise fall back to the connection scheme. WSGI trusts this
    # via ProxyFix in wsgi.py.
    map $http_x_forwarded_proto $forwarded_proto {
        ~^(https|http)$ $http_x_forwarded_proto;
        default         $scheme;
    }

    upstream servicedesk_app {
        server 127.0.0.1:8000;
    }

    server {
        listen       8080 default_server;
        server_name  _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /static/ {
            alias /app/app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass         http://servicedesk_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering    off;
        }
    }
}