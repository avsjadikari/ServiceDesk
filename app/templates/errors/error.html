{% extends "base.html" %}
{% block title %}{{ code }} - {{ company_name }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 fw-bold text-muted">{{ code }}</h1>
    <p class="lead">{{ message }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house-door me-1"></i>{{ _('Back to Home') }}
    </a>
</div>
{% endblock %}
